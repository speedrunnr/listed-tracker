<style>
/* Company profile for one tracker company: quote header → price chart → key stats → financial snapshot (₹ Cr, or $ Mn for Nasdaq listings) → Inc42 stories. Same tokens as the tracker page. */
/* colour tokens live in assets/tracker-ui.css */

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 16px 28px; padding-inline: 16px; display: grid; gap: 18px; }

/* ---------- top bar and quote ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.back { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px 0 10px; border-radius: var(--r-ctl); background: var(--surface);
  color: var(--ink-2); font-size: 14px; font-weight: 500; text-decoration: none; min-width: 0; }
.back:hover { background: var(--wash); color: var(--ink); }
.back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { display: flex; align-items: center; padding: 4px 10px; border-radius: 4px; background: var(--brand-grad); font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: #fff; white-space: nowrap; flex: none; }
.mark i { display: none; }
.quote { display: grid; gap: 4px; }
.quote h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.25; }
.quote h1 small { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; margin-left: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
.tag { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 4px; background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.tag b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.price-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.last { font-size: 40px; font-weight: 700; line-height: 1.1; }
.chg { display: inline-flex; align-items: center; gap: 8px; font-size: 21px; font-weight: 500; }
.chg .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.chg.up { color: var(--up); } .chg.up .dot { background: var(--up); }
.chg.down { color: var(--down); } .chg.down .dot { background: var(--down); }
.chg .dot svg { width: 14px; height: 14px; fill: var(--bg); }
.chg.down .dot svg { transform: rotate(180deg); }
.stamp { color: var(--muted); font-size: 14px; }
.stamp .live { display: inline-flex; align-items: center; gap: 6px; }
.stamp .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up-line); }
.stamp .nw { white-space: nowrap; }

/* ---------- chart card ---------- */
.card { background: var(--surface); border-radius: var(--r-card); padding: 6px; display: grid; gap: 6px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 6px 2px; }
.seg { display: inline-flex; padding: 3px; border-radius: var(--r-ctl); background: var(--wash); flex: none; }
.seg button { border: 0; background: none; cursor: pointer; height: 34px; padding: 0 14px; border-radius: var(--r-ctl); font-weight: 500; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--hair); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.plot { position: relative; background: var(--surface); border-radius: 12px; min-width: 0; }
#chart { height: 320px; }
.axis-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 4px 12px; flex-wrap: wrap; padding: 8px 12px 0; min-height: 26px; }
.ytitle, .xtitle { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
.ytitle { margin-left: auto; white-space: nowrap; }
.xtitle { text-align: center; padding: 2px 12px 8px; }
.chartbox { position: relative; }
#chart:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 8px; }
.tip { position: absolute; top: 6px; z-index: 4; pointer-events: none; background: var(--raised); color: var(--ink); border-radius: 10px; box-shadow: var(--shadow);
  padding: 8px 11px; font-size: 13px; min-width: 120px; transform: translateX(-50%); white-space: nowrap; }
.tip .t { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; font-variant-numeric: tabular-nums; }
.tip .row b { font-weight: 600; }
.tip .row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.tip .up { color: var(--up); } .tip .down { color: var(--down); }
.pcl { position: absolute; right: 74px; z-index: 2; transform: translateY(-120%); font-size: 12.5px; color: var(--ink-2); pointer-events: none; background: var(--surface); padding: 0 4px; }
.pcl b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.pcl.below { transform: translateY(20%); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.ranges { display: flex; gap: 4px; padding: 4px 6px 6px; overflow-x: auto; scrollbar-width: none; }
.ranges::-webkit-scrollbar { display: none; }
.ranges button { border: 0; background: none; cursor: pointer; height: 40px; min-width: 56px; padding: 0 12px; border-radius: var(--r-ctl); font-size: 15px; font-weight: 500; color: var(--ink-2); flex: none; }
.ranges button:hover { background: var(--wash); }
.ranges button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--hair); }
.ranges button:disabled { opacity: .4; cursor: not-allowed; background: none; }

/* ---------- sections ---------- */
section.block { display: grid; gap: 12px; min-width: 0; }
.bhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; border-bottom: 2px solid var(--head-rule); padding-bottom: 10px; }
h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3; }
h2 small { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 28px; margin: 0; }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--hair); min-width: 0; }
.stat dt { color: var(--ink-2); min-width: 0; }
.stat dd { margin: 0; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat dd small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: var(--r-card); overflow: hidden; }
.tiles div { background: var(--tile); padding: 12px 14px; min-width: 0; }
.tiles span { display: block; font-size: 12.5px; color: var(--ink-2); }
.tiles b { display: block; font-size: 20px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tiles em { display: block; font-style: normal; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.tiles em.up { color: var(--up); } .tiles em.down { color: var(--down); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-weight: 600; color: var(--ink-2); background: var(--head-bg); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--hair-strong); white-space: nowrap; text-align: right; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; }
td:first-child { background: var(--bg); }
td { padding: 10px; border-bottom: 1px solid var(--hair); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td:first-child { color: var(--ink-2); }
tr.sub td { font-size: 13px; color: var(--muted); padding-top: 4px; }
tr.sub td:first-child { padding-left: 18px; }
td.neg { color: var(--down); }
.bal { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--ink-2); }
.bal b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13px; margin: 0; }

.news { list-style: none; margin: 0; padding: 0; display: grid; }
.news li { border-bottom: 1px solid var(--hair); }
.news a { display: grid; gap: 3px; padding: 12px 4px; text-decoration: none; }
.news a:hover .nt { color: var(--link); }
.news .nt { font-weight: 600; font-size: 15.5px; line-height: 1.35; text-wrap: pretty; }
.news .nm { font-size: 12.5px; color: var(--muted); }
.news .nm b { color: var(--brand); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11.5px; margin-right: 6px; }
.empty { color: var(--muted); padding: 8px 0; }

footer { color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; border-top: 1px solid var(--hair); padding-top: 12px; }
footer a { color: var(--ink-2); }
.err { padding: 40px 0; text-align: center; color: var(--ink-2); }

@media (max-width: 640px) {
  .quote h1 { font-size: 22px; }
  .last { font-size: 32px; }
  .chg { font-size: 17px; }
  #chart { height: 260px; }
  .stats { grid-template-columns: 1fr; }
  .tiles { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles div:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .ranges { gap: 0; padding-inline: 2px; justify-content: space-between; }
  .ranges button { min-width: 0; padding: 0 9px; font-size: 14px; height: 36px; }
  .axis-row { padding-inline: 8px; }
  .seg button { padding: 0 11px; }
    table { font-size: 13.5px; }
  th, td { padding-inline: 6px; }
  tr.sub td:first-child { padding-left: 12px; }
  .mark { display: none; }
}
@media (max-width: 359px) {
  .wrap { padding-inline: 12px; }
  .ranges button { padding: 0 5px; font-size: 13px; }
  .seg button { padding: 0 8px; font-size: 13.5px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
"use strict";
const LWC = window.LightweightCharts;
const DATA = "data/";
const PARAMS = new URLSearchParams(location.search);
// ?id=ETERNAL_NS, or #ETERNAL_NS where a host passes only the hash through (the claude.ai artifact viewer)
const HASH_ID = /^[A-Z0-9_]+$/.test(location.hash.slice(1)) ? location.hash.slice(1) : null;
const ID = (PARAMS.get("id") || HASH_ID || "").replace(/[^A-Za-z0-9_]/g, "");
const RANGES = [
  { id: "1D", label: "1D", phrase: "Today" },
  { id: "5D", label: "5D", phrase: "past 5 days" },
  { id: "1M", label: "1M", phrase: "past month" },
  { id: "6M", label: "6M", phrase: "past 6 months" },
  { id: "YTD", label: "YTD", phrase: "year to date" },
  { id: "1Y", label: "1Y", phrase: "past year" },
  { id: "5Y", label: "5Y", phrase: "past 5 years" },
  { id: "MAX", label: "MAX", phrase: "since listing" },
];
const TYPES = [{ id: "area", label: "Area" }, { id: "line", label: "Line" }, { id: "candle", label: "Candle" }];
const ARROW = '<svg viewBox="0 0 24 24"><path d="M12 4l7 8h-5v8h-4v-8H5z"/></svg>';
const state = { range: "1Y", type: "area", fin: "annual" };
let CO, SAVED, LIVE = null, chart = null;
let chartSlots = 0, keepView = null;
// a remembered range this company can't show (5Y on a recent listing) stays remembered for the next one
let wantRange = null;
// The reader's chart and financials choices carry across profiles and reloads for the session
const STORE_KEY = "inc42:tracker:company";
// Latest quotes, as kept by the tracker page so a profile opened from the table has them at once
const LIVE_KEY = "inc42:tracker:live";
// Past this age, in seconds, an open market's price reads as delayed: India refreshes more often than Nasdaq
const LIVE_MAX_AGE = { INR: 1800, USD: 4500 };
// How often an open page looks for new prices on a host with no database, in milliseconds
const LIVE_POLL = 300000;
function saveState() {
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ ...state, range: wantRange || state.range })); } catch (e) { /* not remembered */ }
}
function restoreState() {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  if (!s || typeof s !== "object") return;
  if (RANGES.some((r) => r.id === s.range)) state.range = s.range;
  if (TYPES.some((t) => t.id === s.type)) state.type = s.type;
  if (s.fin === "annual" || s.fin === "quarterly") state.fin = s.fin;
}

const $ = (s) => document.querySelector(s);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pc1 = (v) => v == null ? null : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(Math.abs(v) < 10 ? 1 : 0) + "%";
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt = (v) => nf2.format(v);
const pct = (v, d = 2) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
const signed = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + nf2.format(Math.abs(v));
// the rupee, or the dollar for Nasdaq listings; statements are in ₹ crore or $ million
const SYM = () => (CO.currency === "USD" ? "$" : "₹");
const UNIT = () => (CO.currency === "USD" ? "Mn" : "Cr");
// amounts grouped as in the tracker table; one decimal below 100 so small figures keep their detail
const cr = (v) => v == null ? "—" : (v < 0 ? "−" : "") + (Math.abs(v) < 100 ? nf1 : nf0).format(Math.abs(v));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dstr = (s) => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const clock = (sec) => { const d = new Date(sec * 1000); let h = d.getUTCHours(); const m = d.getUTCMinutes();
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; };
const dayOf = (sec) => { const d = new Date(sec * 1000); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

async function getJSON(path) {
  const r = await fetch(DATA + path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r.json();
}
/* ---------------- range maths ---------------- */
const isIntraday = (r) => r === "1D" || r === "5D";
function rangeStart(lastDate, r) {
  const d = new Date(lastDate + "T00:00:00Z");
  const back = { "1M": [0, 1], "6M": [0, 6], "1Y": [1, 0], "5Y": [5, 0] }[r];
  if (back) { d.setUTCFullYear(d.getUTCFullYear() - back[0]); d.setUTCMonth(d.getUTCMonth() - back[1]); }
  if (r === "YTD") return `${d.getUTCFullYear() - 1}-12-31`;
  if (r === "MAX") return "0000-00-00";
  return d.toISOString().slice(0, 10);
}
function sliceDaily(rows, r, lastDate) {
  const start = rangeStart(lastDate, r);
  let i = 0;
  for (let k = 0; k < rows.length; k++) { if (rows[k][0] <= start) i = k; else break; }
  return rows.slice(i);
}
function sliceSessions(sessions, r) {
  const use = r === "1D" ? sessions.slice(-1) : sessions.slice(-5);
  if (!use.length) return null;
  const pts = use.flatMap((s) => s.points);
  return { pts, base: use[0].prev_close ?? pts[0][1] };
}
function view(r) {
  if (isIntraday(r)) {
    const s = sliceSessions(CO.sessions, r);
    return { kind: "intraday", pts: s.pts.map(([t, v]) => ({ time: t, value: v })), base: s.base };
  }
  const rows = sliceDaily(CO.daily, r, CO.session_date);
  return { kind: "daily", pts: rows.map((x) => ({ time: x[0], value: x[4] })),
    ohlc: rows.map((x) => ({ time: x[0], open: x[1], high: x[2], low: x[3], close: x[4] })),
    // MAX reads as "since listing", which the tracker measures from the listing price
    base: r === "MAX" && CO.tracker.listing_price ? CO.tracker.listing_price : rows[0][4] };
}
function intradayCandles(pts, minutes) {
  const out = []; let cur = null, prev = null;
  for (const p of pts) {
    const b = Math.floor(p.time / (minutes * 60)) * minutes * 60;
    if (!cur || cur.time !== b) {
      if (cur) out.push(cur);
      const o = prev && dayOf(prev.time) === dayOf(p.time) ? prev.value : p.value;
      cur = { time: b, open: o, high: Math.max(o, p.value), low: Math.min(o, p.value), close: p.value };
    } else { cur.high = Math.max(cur.high, p.value); cur.low = Math.min(cur.low, p.value); cur.close = p.value; }
    prev = p;
  }
  if (cur) out.push(cur);
  return out;
}

/* ---------------- live prices ---------------- */
// Profiles are built weekly. The latest quotes go over that saved data here, and everything the price drives
// follows. The tracker table stays on its Saturday close.
const liveSession = ([date, prev_close, t0, step, closes, slots]) => ({ date, prev_close,
  points: closes.map((v, i) => [t0 + (slots ? slots[i] : i) * step, v]) });
const byKey = (rows, key, more) => {
  const m = new Map(rows.map((x) => [key(x), x]));
  for (const x of more) m.set(key(x), x);
  return [...m.values()].sort((a, b) => (key(a) < key(b) ? -1 : 1));
};
function withLive(L) {
  const q = L && L.q && L.q[ID];
  if (!q || q.d < SAVED.session_date) return SAVED;
  const co = JSON.parse(JSON.stringify(SAVED)), T = co.tracker, s = co.stats;
  // A split or bonus since the last build changes Yahoo's past prices, so scale the saved ones to match
  const saved = new Map(co.daily.map((r) => [r[0], r[4]]));
  const same = q.days.find((r) => saved.has(r[0]));
  const k = same && Math.abs(same[4] / saved.get(same[0]) - 1) > 0.02 ? same[4] / saved.get(same[0]) : 1;
  if (k !== 1) {
    for (const r of co.daily) for (let i = 1; i <= 4; i++) r[i] *= k;
    for (const x of co.sessions) { if (x.prev_close != null) x.prev_close *= k; for (const p of x.points) p[1] *= k; }
    if (T.listing_price != null) T.listing_price *= k;
    s.wk52_high *= k; s.wk52_low *= k;
  }
  const move = q.p / (SAVED.price * k);
  co.daily = byKey(co.daily, (r) => r[0], q.days.map((r) => r.slice()));
  co.sessions = byKey(co.sessions, (x) => x.date, q.s.map(liveSession));
  co.price = q.p; co.session_date = q.d;
  if (q.pc != null) co.prev_close = q.pc;
  if (T.mcap != null) T.mcap *= move;
  if (T.mcap != null && T.debut_mcap) T.mcap_chg = (T.mcap / T.debut_mcap - 1) * 100;
  if (T.listing_price) T.price_chg = (q.p / T.listing_price - 1) * 100;
  if (s.pe_ttm != null) s.pe_ttm *= move;
  if (s.pb != null) s.pb *= move;
  for (const r of q.days) {
    if (r[2] > s.wk52_high) { s.wk52_high = r[2]; s.wk52_high_date = r[0]; }
    if (r[3] < s.wk52_low) { s.wk52_low = r[3]; s.wk52_low_date = r[0]; }
  }
  return co;
}
// "hours": the clock is inside the session. "open": the quotes also show the market trading today, which a
// holiday never does.
function marketState() {
  const us = CO.currency === "USD";
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: us ? "America/New_York" : "Asia/Kolkata", weekday: "short",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  const mins = +p.hour * 60 + +p.minute, [from, to] = us ? [570, 960] : [555, 930];
  const hours = !["Sat", "Sun"].includes(p.weekday) && mins >= from && mins < to;
  const m = LIVE.markets && LIVE.markets[us ? "US" : "NSE"];
  return { hours, open: hours && !!m && m.date === `${p.year}-${p.month}-${p.day}` };
}
function renderStamp() {
  const el = $("#stamp"), ex = CO.exchange_label;
  const close = `Closing price of ${dstr(CO.session_date)} · ${ex}`;
  if (!LIVE || !LIVE.q[ID]) { el.textContent = `${close} · Refreshed ${CO.refresh.replace("Every ", "every ")}`; return; }
  const { hours, open } = marketState();
  const at = `${clock(LIVE.updated + 19800)} IST`;
  if (open && CO.session_date < LIVE.markets[CO.currency === "USD" ? "US" : "NSE"].date) el.textContent = `No trades yet today · ${close}`;
  else if (open && Date.now() / 1000 - LIVE.updated <= LIVE_MAX_AGE[CO.currency]) el.innerHTML = `<span class="live">Live</span> · Updated ${at} · ${esc(ex)}`;
  else if (open) el.textContent = `Delayed · Last updated ${at} · ${ex}`;
  // the last update can fall before that session's close (15:30 IST, or 16:00 New York at its latest in UTC)
  else if (LIVE.updated < Date.parse(`${CO.session_date}T${CO.currency === "USD" ? "21" : "10"}:00:00Z`) / 1000) el.textContent = `Last updated ${at}, ${dstr(CO.session_date)} · ${ex}`;
  else el.textContent = hours ? close : `Market closed · ${close}`;
}
function applyLive(L) {
  if (!L || !L.q || (LIVE && L.updated <= LIVE.updated)) return;
  LIVE = L;
  CO = withLive(L);
  renderControls(); renderStats();
  if (!chart) { renderStamp(); return; }
  // keep the stretch of time the reader zoomed to
  const lr = chart.timeScale().getVisibleLogicalRange();
  if (lr && (lr.from > 0.5 || lr.to < chartSlots - 1.5)) keepView = chart.timeScale().getVisibleRange();
  renderChart();
}
const fetchLive = () => getJSON(`live/${ID}.json?t=${Math.floor(Date.now() / LIVE_POLL)}`).catch(() => null);
async function connectLive() {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (db) { db.doc("live/quotes").onSnapshot((s) => { if (s.exists) applyLive(s.data()); }, () => {}); return; }
  // A static host: the prices are plain files, rewritten about every 20 minutes in market hours
  const check = async () => { if (!document.hidden) applyLive(await fetchLive()); };
  setInterval(check, LIVE_POLL);
  document.addEventListener("visibilitychange", check);
}

/* ---------------- chart ---------------- */
function themeColors() {
  return { surface: css("--card"), ink2: css("--ink-2"), muted: css("--muted"), hair: css("--hair"),
    up: css("--up-line"), upFill: css("--up-fill"), down: css("--down-line"), downFill: css("--down-fill"),
    font: css("--font") };
}
const transparent = (c) => (c.startsWith("rgba") ? c.replace(/[\d.]+\)$/, "0)") : c + "00");

function renderChart() {
  saveState();
  const r = state.range, v = view(r), intraday = v.kind === "intraday";
  renderHeader(v);
  const C = themeColors();
  const el = $("#chart");
  $("#tip").hidden = true;
  if (chart) { chart.remove(); chart = null; }
  $("#loading").hidden = true;
  $("#xtitle").textContent = intraday ? "Time (IST)" : "Date";

  chart = LWC.createChart(el, {
    autoSize: true,
    layout: { background: { type: "solid", color: C.surface }, textColor: C.muted, fontFamily: C.font, fontSize: 12, attributionLogo: false },
    grid: { vertLines: { visible: false }, horzLines: { color: C.hair } },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.06 } },
    timeScale: { borderVisible: false, timeVisible: intraday, secondsVisible: false, rightOffset: 0, fixLeftEdge: true, fixRightEdge: true,
      lockVisibleTimeRangeOnResize: true,
      tickMarkFormatter: (time, type) => {
        if (typeof time === "number") return type === LWC.TickMarkType.Time ? clock(time) : dayOf(time);
        const s = typeof time === "string" ? time : `${time.year}-${String(time.month).padStart(2, "0")}-${String(time.day).padStart(2, "0")}`;
        const [y, m, d] = s.split("-").map(Number);
        if (type === LWC.TickMarkType.Year) return String(y);
        if (type === LWC.TickMarkType.Month) return MONTHS[m - 1];
        return `${MONTHS[m - 1]} ${d}`;
      } },
    crosshair: { mode: LWC.CrosshairMode.Normal,
      vertLine: { color: C.muted, width: 1, style: LWC.LineStyle.Solid, labelVisible: false },
      horzLine: { color: C.muted, width: 1, style: LWC.LineStyle.Dashed, labelBackgroundColor: C.ink2 } },
    // Same touch contract as the index widget: vertical swipes scroll the article
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { mouseWheel: false, pinch: true, axisPressedMouseMove: { time: true, price: false }, axisDoubleClickReset: { time: true, price: true } },
    localization: { locale: "en-US", priceFormatter: fmt },
  });

  const up = v.pts[v.pts.length - 1].value >= v.base;
  const lineCol = up ? C.up : C.down;
  const tips = [];
  let main, mainData;
  if (state.type === "candle") {
    mainData = intraday ? intradayCandles(v.pts, r === "1D" ? 15 : 60) : v.ohlc;
    main = chart.addSeries(LWC.CandlestickSeries, { upColor: C.up, downColor: C.down, borderVisible: false, wickUpColor: C.up, wickDownColor: C.down, priceLineVisible: false });
    main.setData(mainData);
    tips.push({ series: main, ohlc: true });
  } else {
    mainData = v.pts;
    main = state.type === "line"
      ? chart.addSeries(LWC.LineSeries, { color: lineCol, lineWidth: 2, priceLineVisible: false, crosshairMarkerRadius: 4 })
      : chart.addSeries(LWC.AreaSeries, { lineColor: lineCol, topColor: up ? C.upFill : C.downFill, bottomColor: transparent(up ? C.upFill : C.downFill),
          lineWidth: 2, priceLineVisible: false, crosshairMarkerRadius: 4 });
    main.setData(mainData);
    tips.push({ series: main });
  }

  const slots = mainData.length;
  chartSlots = slots;
  chart.timeScale().setVisibleLogicalRange({ from: 0, to: slots - 1 });
  // a data refresh redraws the chart; put back the stretch of time the reader had zoomed to
  if (keepView) { try { chart.timeScale().setVisibleRange(keepView); } catch (e) {} keepView = null; }

  // Previous close reference on intraday ranges
  const pcl = $("#pcl");
  pcl.hidden = true;
  if (intraday) {
    main.createPriceLine({ price: v.base, color: C.muted, lineWidth: 1, lineStyle: LWC.LineStyle.SparseDotted, axisLabelVisible: false, title: "" });
    main.applyOptions({ autoscaleInfoProvider: (orig) => {
      const res = orig();
      if (!res || !res.priceRange) return res;
      return { ...res, priceRange: { minValue: Math.min(res.priceRange.minValue, v.base), maxValue: Math.max(res.priceRange.maxValue, v.base) } };
    } });
    pcl.innerHTML = `${r === "1D" ? "Prev. close" : "Close before period"} <b>${fmt(v.base)}</b>`;
    const owner = chart;
    const place = () => {
      if (chart !== owner) return;
      const y = main.priceToCoordinate(v.base);
      if (y == null) { pcl.hidden = true; return; }
      pcl.style.top = y + "px"; pcl.classList.toggle("below", y < 24); pcl.hidden = false;
    };
    requestAnimationFrame(place);
    chart.timeScale().subscribeVisibleLogicalRangeChange(() => requestAnimationFrame(place));
  }

  const tip = $("#tip");
  chart.subscribeCrosshairMove((p) => {
    if (!p.time || !p.point || p.point.x < 0) { tip.hidden = true; return; }
    const rows = [];
    for (const t of tips) {
      const d = p.seriesData.get(t.series);
      if (!d) continue;
      if (t.ohlc) rows.push(...[["Open", d.open], ["High", d.high], ["Low", d.low], ["Close", d.close]]
        .map(([k, x]) => `<div class="row"><span>${k}</span><b>${fmt(x)}</b></div>`));
      else { const ch = d.value / v.base - 1;
        rows.push(`<div class="row"><b style="font-size:15px">${SYM()}${fmt(d.value)}</b><span class="${ch >= 0 ? "up" : "down"}">${pct(ch)}</span></div>`); }
    }
    if (!rows.length) { tip.hidden = true; return; }

  });

}

// A range this company's history can fill: intraday needs 5-minute bars, the rest enough days
function rangeOk(id) {
  if (isIntraday(id)) return CO.sessions.length > 0;
  return id === "MAX" || rangeStart(CO.session_date, id) >= CO.daily[0][0];
}
function renderControls() {
  $("#types").innerHTML = TYPES.map((t) => `<button type="button" data-type="${t.id}" aria-pressed="${state.type === t.id}">${t.label}</button>`).join("");

    return `<button data-range="${r.id}" aria-pressed="${state.range === r.id}" ${na ? `disabled title="${why}"` : ""}>${r.label}</button>`;

/* ---------------- financials ---------------- */
const margin = (a, b) => (a == null || !b ? null : a / b);
function growth(cur, prev) {
  if (cur == null || prev == null) return null;
  if (prev <= 0) return cur > 0 && prev < 0 ? "turned positive" : null;
  return cur / prev - 1;
}
function renderFin() {
  const F = CO.financials;
  const q = state.fin === "quarterly";
  const rows = q ? F.quarterly : F.annual;
  for (const b of document.querySelectorAll("#finSeg [data-fin]")) b.setAttribute("aria-pressed", b.dataset.fin === state.fin);
  saveState();
  $("#finSub").textContent = `${SYM()} ${UNIT()} · ${F.basis.toLowerCase()} · EPS in ${SYM()}`;
  // Headline tiles: the latest period against the same period a year earlier where the source has
  // it (the quarter four slots back), otherwise against the period before
  const has = (x) => x.revenue != null || x.pat != null;
  const cur = rows.find(has);
  const k = rows.indexOf(cur);
  const yago = q ? rows[k + 4] : rows[k + 1];
  const ref = yago && has(yago) ? yago : rows.slice(k + 1).find(has);
  $("#finTable").hidden = !cur;
  $("#finEmpty").hidden = !!cur;
  const vs = ref ? (ref === yago ? `YoY vs ${ref.label}` : `vs ${ref.label}`) : "";
  // lenders and insurers report no EBITDA, and some filings lack a line: leave those tiles out
  const tile = (label, raw, val, g, unit) => {
    if (raw == null) return "";
    const gt = g == null ? "" : typeof g === "string" ? g : pct(g, 1);
    const cls = g == null ? "" : typeof g === "string" || g >= 0 ? "up" : "down";
    return `<div><span>${label}</span><b>${val}${unit || ""}</b><em class="${cls}">${gt ? `${gt} ${vs}` : "&nbsp;"}</em></div>`;
  };
  $("#finTiles").innerHTML = cur ? [
    tile(`Revenue, ${cur.label}`, cur.revenue, SYM() + cr(cur.revenue), ref && growth(cur.revenue, ref.revenue), " " + UNIT()),
    tile(cur.revenue == null ? `EBITDA, ${cur.label}` : "EBITDA", cur.ebitda, SYM() + cr(cur.ebitda), ref && growth(cur.ebitda, ref.ebitda), " " + UNIT()),
    tile(cur.revenue == null ? `Net profit, ${cur.label}` : "Net profit", cur.pat, SYM() + cr(cur.pat), ref && growth(cur.pat, ref.pat), " " + UNIT()),
    tile("EPS", cur.eps, SYM() + (cur.eps == null ? "—" : (cur.eps < 0 ? "−" : "") + nf2.format(Math.abs(cur.eps))), ref && growth(cur.eps, ref.eps)),
  ].join("") : "";
  $("#finHead").innerHTML = `<th scope="col">${SYM()} ${UNIT()}</th>` + rows.map((x) => `<th scope="col">${x.label}</th>`).join("");
  // a line the source has for no period at all (EBITDA for a bank, say) is left out
  const line = (label, f, cls, sub) => rows.every((x) => f(x) == null) ? "" : `<tr class="${cls || ""}"><td>${label}</td>${rows.map((x) => {
    const val = f(x);
    return `<td class="${typeof val === "number" && val < 0 ? "neg" : ""}">${val == null ? "—" : sub ? (val < 0 ? "−" : "") + Math.abs(val * 100).toFixed(1) + "%" : typeof val === "number" ? cr(val) : val}</td>`;
  }).join("")}</tr>`;
  $("#finBody").innerHTML = [
    line("Revenue", (x) => x.revenue),
    line("EBITDA", (x) => x.ebitda),
    line("Margin", (x) => margin(x.ebitda, x.revenue), "sub", true),
    line("Net profit", (x) => x.pat),
    line("Margin", (x) => margin(x.pat, x.revenue), "sub", true),
    line(`EPS (${SYM()})`, (x) => (x.eps == null ? null : (x.eps < 0 ? "−" : "") + nf2.format(Math.abs(x.eps)))),
  ].join("");
  const B = F.balance;
  $("#bal").innerHTML = B ? `<span>Balance sheet, ${B.label}:</span><span>Cash and investments <b>${SYM()}${cr(B.cash)} ${UNIT()}</b></span>
    <span>Total debt <b>${SYM()}${cr(B.debt)} ${UNIT()}</b></span><span>Net worth <b>${SYM()}${cr(B.net_worth)} ${UNIT()}</b></span>` : "";
  const gaps = rows.filter((x) => x.revenue == null).map((x) => x.label);
  // no statements from the source: show the tracker's own annual figures
  const T = CO.tracker;
  if (!F.annual.some(has) && !F.quarterly.some(has) && (T.sales != null || T.net_profit != null)) {
    const m = (v) => v == null ? null : (v < 0 ? "−" : "") + SYM() + cr(Math.abs(v)) + " " + UNIT();

    $("#finTiles").innerHTML = [m(T.sales) && `<div><span>Sales, ${esc(CO.financials_label)}</span><b>${m(T.sales)}</b><em class="${T.sales_yoy > 0 ? "up" : T.sales_yoy < 0 ? "down" : ""}">${T.sales_yoy == null ? "&nbsp;" : pc1(T.sales_yoy) + " YoY"}</em></div>`,
      m(T.net_profit) && `<div><span>Net profit, ${esc(CO.financials_label)}</span><b>${m(T.net_profit)}</b><em>&nbsp;</em></div>`].filter(Boolean).join("");
    $("#finNote").textContent = `Figures from the Inc42 tracker. Yahoo Finance has no detailed statements for this listing yet.`;
    return;
  }
  $("#finNote").textContent = `${F.basis} figures as reported, ${F.source.replace(/^Company/, "company")}. ${F.calendar_year ? "Years end in December" : "Years end in March"}. Revenue is revenue from operations; EBITDA as reported by the source; margins are on revenue.` +

/* ---------------- events ---------------- */
function wire() {
  $("#types").addEventListener("click", (e) => { const b = e.target.closest("[data-type]"); if (!b || b.disabled) return;
    state.type = b.dataset.type; renderControls(); renderChart(); });
  $("#ranges").addEventListener("click", (e) => { const b = e.target.closest("[data-range]"); if (!b || b.disabled) return;
    state.range = b.dataset.range; wantRange = null; renderControls(); renderChart(); });
  $("#finSeg").addEventListener("click", (e) => { const b = e.target.closest("[data-fin]"); if (!b) return; state.fin = b.dataset.fin; renderFin(); });
  // Trackpad pinch arrives as Ctrl + wheel; plain wheel keeps scrolling the article
  $("#chart").addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey) || !chart) return;
    e.preventDefault();
    const ts = chart.timeScale(), lr = ts.getVisibleLogicalRange();
    if (!lr) return;
    const w = (lr.to - lr.from) * (e.deltaY > 0 ? 1.2 : 0.83), to = lr.to;
    ts.setVisibleLogicalRange({ from: Math.max(0, to - Math.max(8, w)), to });
  }, { passive: false });
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener("change", renderChart) : mq.addListener(renderChart));
  new MutationObserver(renderChart).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
// Embedded in an article: report the content height so the host page can size the iframe
function reportHeight() {
  if (window.parent === window) return;
  let last = 0;
  const post = () => {
    const h = Math.ceil(document.body.getBoundingClientRect().height);
    if (!h || h === last) return;
    last = h;
    window.parent.postMessage({ type: "inc42-tracker-height", widget: "company", id: ID, height: h }, "*");
    window.parent.postMessage({ sentinel: "amp", type: "embed-size", height: h }, "*");     // an AMP article's amp-iframe
  };
  if ("ResizeObserver" in window) new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
  window.parent.postMessage({ type: "inc42-tracker-page", page: "company", id: ID }, "*");
  post();
}

async function init() {
  reportHeight();
  // Back to the page the reader came from, which keeps an embed's single table; otherwise the tracker, in the theme an embed asked for
  const th = PARAMS.get("theme");
  const from = document.referrer ? new URL(document.referrer) : null;
  $("#back").href = from && from.origin === location.origin && from.pathname !== location.pathname
    ? `${from.origin}${from.pathname}${from.search}#table`
    : "index.html" + (th ? "?theme=" + encodeURIComponent(th) : "") + "#table";
  let fresh = null;
  try {
    [SAVED, fresh] = await Promise.all([getJSON(`companies/${ID}.json`), window.claude ? null : fetchLive()]);
    CO = SAVED;
  } catch (err) {
    $("#name").textContent = "Company not found";
    $("#app").querySelectorAll("section, .quote .tags, .price-row").forEach((x) => (x.hidden = true));
    $("#stamp").innerHTML = `There is no profile for “${esc(ID)}” yet. <a href="${$("#back").href}">Back to the tracker</a>.`;
    return;
  }
  try {
    const held = JSON.parse(localStorage.getItem(LIVE_KEY) || "null");
    if (held && held.q) { LIVE = held; CO = withLive(held); }
  } catch (e) { /* no stored quotes */ }
  if (fresh && fresh.q && (!LIVE || fresh.updated > LIVE.updated)) { LIVE = fresh; CO = withLive(fresh); }
  restoreState();
  fitStateToData();
  renderAll();
  wire();
  if (LWC) renderChart(); else { renderStamp(); $("#loading").textContent = "The chart library did not load. Refresh the page to try again."; }
  setInterval(renderStamp, 60000);
  connectLive();
}
// Choices remembered from another company may not fit this one (a 5Y range on a recent listing)
function fitStateToData() {
  const hasFig = (x) => x.revenue != null || x.pat != null;
  const F = CO.financials;
  if (!F[state.fin].some(hasFig) && F[state.fin === "annual" ? "quarterly" : "annual"].some(hasFig))
    state.fin = state.fin === "annual" ? "quarterly" : "annual";
  $("#finSeg").hidden = !F.annual.some(hasFig) || !F.quarterly.some(hasFig);
  if (!rangeOk(state.range)) { wantRange = state.range; state.range = "MAX"; }
}
function renderAll() { renderIdentity(); renderControls(); renderStats(); renderFin(); renderNews(); renderFooter(); }

init();
})();
</script>
